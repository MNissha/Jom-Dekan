name: jomdekan

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jomdekan
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - jomdekan_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Real malware scanning (backend MALWARE_SCAN_PROVIDER=clamav). Opt-in
  # only — not part of the default `docker compose up` stack, so no
  # developer is forced to download/run it just to work on the app.
  # Enable with: docker compose --profile security up -d clamav
  # then set MALWARE_SCAN_PROVIDER=clamav (and CLAMAV_HOST=clamav) in
  # your .env and restart the backend. No `ports:` mapping — reachable
  # only from other containers on this compose network, never the host.
  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    profiles: ['security']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - jomdekan_clamav_data:/var/lib/clamav

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      # Use DB_* values from the private root .env when present (for
      # example Supabase); otherwise fall back to the local Postgres
      # service above for a self-contained development stack.
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-jomdekan}
      DB_SSL: ${DB_SSL:-false}
      REDIS_URL: redis://redis:6379
      # No hardcoded fallback here on purpose: these are real secrets, and
      # a fallback string checked into source control (this repo is on
      # GitHub) would be a predictable, public secret for any deployment
      # that forgot to set .env. Leaving them unset means the container
      # fails fast at startup instead — see env.ts's min(32)/min(16)
      # validation — same behavior DB_HOST etc. already have.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      # Same pattern as DB_* above: uses real Supabase Storage credentials
      # from the private root .env when present, otherwise falls back to
      # the self-contained local-fs adapter (files on the backend volume,
      # no cloud account needed).
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local-fs}
      STORAGE_LOCAL_ROOT: /app/backend/storage/resources
      STORAGE_BUCKET: ${STORAGE_BUCKET:-jomdekan-resources}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      # Same reasoning as JWT_*/COOKIE_SECRET above — no public fallback.
      STORAGE_SIGNING_SECRET: ${STORAGE_SIGNING_SECRET}
      # Same pattern as STORAGE_*/GOOGLE_* above: reads real SMTP
      # credentials from the private root .env when present, otherwise
      # falls back to the self-contained console adapter (logs the email
      # instead of sending it, no real mailbox needed).
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@jomdekan.app}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Same pattern as DB_*/STORAGE_* above: reads real Google OAuth
      # client credentials from the private root .env when present, so
      # tutors can connect Google Calendar; the feature stays disabled
      # (a clear "not configured" error) with no crash when left blank.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_SUMMARY_ENABLED: ${AI_SUMMARY_ENABLED:-true}
      AI_AGENT_ENABLED: ${AI_AGENT_ENABLED:-true}
      # Wasn't passed through at all before — .env could set this and it
      # would silently never reach the container, always falling back to
      # env.ts's own default regardless. See env.ts for why 2000 and not
      # the old 600 (the schema's own worst case needs closer to 1500).
      AI_AGENT_MAX_OUTPUT_TOKENS: ${AI_AGENT_MAX_OUTPUT_TOKENS:-2000}
      # Rate limiting: "auto" (default) uses this Redis service above
      # since REDIS_URL is always set here — no extra configuration
      # needed to exercise the Redis-backed store in this stack.
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-auto}
      RATE_LIMIT_REDIS_REQUIRED: ${RATE_LIMIT_REDIS_REQUIRED:-}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-jomdekan:rate-limit:}
      # Malware scanning: stays on the honest dev stub unless you both
      # (a) start the clamav service — `docker compose --profile
      # security up -d clamav` — and (b) set MALWARE_SCAN_PROVIDER=clamav
      # in your .env. See SECURITY.md.
      MALWARE_SCAN_PROVIDER: ${MALWARE_SCAN_PROVIDER:-stub}
      MALWARE_SCAN_REQUIRED: ${MALWARE_SCAN_REQUIRED:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MALWARE_SCAN_TIMEOUT_MS: ${MALWARE_SCAN_TIMEOUT_MS:-15000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database:ro
      - backend_node_modules:/app/backend/node_modules
      - jomdekan_resource_files:/app/backend/storage/resources
    command: sh -c "npm run migrate && npm run dev"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-3000}/api/v1
      VITE_API_TIMEOUT: 10000
      VITE_APP_NAME: JomDekan
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  jomdekan_postgres_data:
  jomdekan_resource_files:
  jomdekan_clamav_data:
  backend_node_modules:
  frontend_node_modules:
